version: 2
updates:
  # Action はコミットのハッシュで固定している（scripts/check-workflows.sh）。
  # 固定したままだと更新が止まるので、新しい版が出たら Dependabot がハッシュと
  # 版のコメントを書き換えた PR を出す。PR が増えすぎないよう月1回・1本にまとめる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 自動で出すのはマイナー版・パッチ版だけ。メジャー版は動きが変わることがあり、
    # deploy・simulation のワークフローは PR の CI では動かないので、変更点を読んでから
    # 1つずつ手で上げる。脆弱性の修正（security updates）はこの設定に関係なく出る。
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # Go の API（apps/api-go）の依存。考え方は上の github-actions と同じで、月1回・1本にまとめ、
  # メジャー版は手で上げる。
  - package-ecosystem: gomod
    directory: /apps/api-go
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      go:
        patterns:
          - "*"
    commit-message:
      prefix: chore
