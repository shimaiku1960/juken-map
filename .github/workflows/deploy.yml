name: Deploy to EC2

on:
  # 手で動かすときと、microCMS で記事を変えたとき（Go が Webhook を受けて GitHub の API で動かす、JUK-112）。
  # どちらも main の最新のコミットで、記事を microCMS から取り直して作り直す。
  workflow_dispatch:
  push:
    branches:
      - main

# 実行を丸ごと1本ずつにする。待てるのは1本だけで、新しく来たものが待っている古いものを置き換える（cancel-in-progress: false
# なので、走っているものは止めない）。後から来たものは同じかより新しいコミット・記事を作るので、置き換えて困ることはない。
# ビルドの段から1本ずつにするのは、記事の作り直しは同じコミット（同じイメージのタグ）で何度も走るため。並んでビルドすると、
# 古い記事のイメージが後から push されてタグを上書きし、新しい記事が出ないことがある。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::961457613174:role/github-actions-juken-map-ecr
          aws-region: ap-northeast-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ブログの記事はビルドで SSG する（JUK-110）。記事を取れなければビルドを止める（SSG_ARTICLES=required）。
      # 同じコミットで作り直すと同じタグを上書きする（ECR のタグは MUTABLE。デプロイは pull し直して入れ替える）。
      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: juken-map
          IMAGE_TAG: ${{ github.sha }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: |
          docker build \
            --secret id=microcms_api_key,env=MICROCMS_API_KEY \
            --build-arg MICROCMS_SERVICE_DOMAIN \
            --build-arg SSG_ARTICLES=required \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # Go の API（apps/api-go、JUK-72）。本番で動くアプリはこれだけ。マイグレーション用の Node のイメージと同じタグにする。
      # 画面（JUK-111）も Go が配るので、上で作った Node のイメージから画面のビルド成果物（/app/web）を写す。
      - name: Build and push (Go)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: juken-map-go
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg APP_COMMIT=$IMAGE_TAG \
            --build-context web=docker-image://$REGISTRY/juken-map:$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG apps/api-go
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      INSTANCE_ID: i-0eeb166295363e11d
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::961457613174:role/github-actions-juken-map-ecr
          aws-region: ap-northeast-1

      - name: Deploy to EC2 via SSM Run Command
        shell: bash
        run: |
          set -euo pipefail

          deploy_script_b64="$(base64 < .github/scripts/deploy-ec2.sh | tr -d '\n')"
          # Alloy（可観測性の収集役）の設定も一緒に運ぶ。EC2 に置き去りの設定ファイルを作らず、
          # リポジトリの中身がそのまま本番の設定になるようにする。
          alloy_config_b64="$(base64 < observability/alloy/production.alloy | tr -d '\n')"
          # nginx で Go へ振り分けるパス。これも本番に手で置かず、リポジトリの中身をそのまま使う。
          go_routes_b64="$(base64 < infra/nginx/juken-map-go-routes.conf | tr -d '\n')"
          # 毎日の通知のタイマー（JUK-85）。複数のファイルなので tar にまとめて運ぶ。
          systemd_units_b64="$(tar -C infra/systemd -cz . | base64 | tr -d '\n')"
          remote_command="echo '$deploy_script_b64' | base64 -d | bash -s -- '$IMAGE_TAG' '$alloy_config_b64' '$go_routes_b64' '$systemd_units_b64'"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 900 \
            --comment "Deploy juken-map ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"

          # Run Commandは結果反映が即時でないため、終端状態までポーリングする。
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          result="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json)"

          echo "$result" | jq -r '.StandardOutputContent'
          echo "$result" | jq -r '.StandardErrorContent' >&2

          status="$(echo "$result" | jq -r '.Status')"
          response_code="$(echo "$result" | jq -r '.ResponseCode')"

          if [ "$status" != "Success" ] || [ "$response_code" -ne 0 ]; then
            echo "SSM deployment failed: status=$status response_code=$response_code" >&2
            exit 1
          fi

  # デプロイのあと、本番に E2E を流す（JUK-101）。中身は e2e-production/（書き込みはしない）。
  # 最初に /api/health のコミットがこの実行の github.sha と一致するかを見る。実行は1本ずつ（上の concurrency）なので、
  # E2E が終わるまで次のデプロイは始まらない。
  # 落ちても本番は戻さない（壊れたことを知らせるだけ。戻すかは人が決める）。
  production-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    # AWS には触らないので、OIDC のトークンは要らない。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production E2E
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: pnpm exec playwright test -c playwright.production.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-playwright-report
          path: playwright-report/
          retention-days: 7
