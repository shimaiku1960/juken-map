name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::961457613174:role/github-actions-juken-map-ecr
          aws-region: ap-northeast-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: juken-map
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            REPO=961457613174.dkr.ecr.ap-northeast-1.amazonaws.com/juken-map
            ENV_FILE=/home/ubuntu/juken-map/.env

            aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 961457613174.dkr.ecr.ap-northeast-1.amazonaws.com

            # 今動いているコンテナのイメージを退避（失敗時のロールバック先）
            PREV=$(docker inspect --format '{{.Config.Image}}' juken-map 2>/dev/null || true)

            # pull の前に不要イメージを掃除して空き容量を確保する。
            # 掃除が pull の後だと、一度ディスクが埋まった時点で pull が失敗し、
            # 掃除まで到達できなくなる（実際に 2026-07-26 のデプロイがこれで失敗した）。
            # この時点では旧コンテナがまだ稼働中なので、ロールバック先の $PREV は
            # 「使用中」として保護される。until フィルタは付けない。1日に何度も
            # デプロイすると当日分のイメージが対象外になり、掃除が効かないため。
            docker image prune -a -f
            df -h / | tail -1

            docker pull $REPO:$IMAGE_TAG
            docker stop juken-map || true
            docker rm juken-map || true
            docker run -d \
              --name juken-map \
              --restart always \
              --env-file $ENV_FILE \
              -p 3000:3000 \
              $REPO:$IMAGE_TAG

            # スモークテスト: /login が 200 を返すまで最大45秒待つ
            ok=false
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
              if [ "$code" = "200" ]; then ok=true; break; fi
              sleep 3
            done

            # 失敗なら前のイメージへロールバックし、デプロイを失敗(赤)にする
            if [ "$ok" != "true" ]; then
              echo "smoke test failed (last code: $code) -> rollback to $PREV"
              docker stop juken-map || true
              docker rm juken-map || true
              if [ -n "$PREV" ]; then
                docker run -d --name juken-map --restart always --env-file $ENV_FILE -p 3000:3000 "$PREV"
              fi
              exit 1
            fi
            echo "smoke test passed"

            # 入れ替えで未使用になった旧イメージをここでも回収する。
            # ロールバックは上の分岐で完了済みなので $PREV を残す必要はない。
            docker image prune -a -f
