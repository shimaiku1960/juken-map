name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::961457613174:role/github-actions-juken-map-ecr
          aws-region: ap-northeast-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: juken-map
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
      INSTANCE_ID: i-0eeb166295363e11d
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::961457613174:role/github-actions-juken-map-ecr
          aws-region: ap-northeast-1

      - name: Deploy to EC2 via SSM Run Command
        shell: bash
        run: |
          set -euo pipefail

          deploy_script_b64="$(base64 < .github/scripts/deploy-ec2.sh | tr -d '\n')"
          # Alloy（可観測性の収集役）の設定も一緒に運ぶ。EC2 に置き去りの設定ファイルを作らず、
          # リポジトリの中身がそのまま本番の設定になるようにする。
          alloy_config_b64="$(base64 < observability/alloy/production.alloy | tr -d '\n')"
          remote_command="echo '$deploy_script_b64' | base64 -d | bash -s -- '$IMAGE_TAG' '$alloy_config_b64'"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 900 \
            --comment "Deploy juken-map ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $command_id"

          # Run Commandは結果反映が即時でないため、終端状態までポーリングする。
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          result="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --output json)"

          echo "$result" | jq -r '.StandardOutputContent'
          echo "$result" | jq -r '.StandardErrorContent' >&2

          status="$(echo "$result" | jq -r '.Status')"
          response_code="$(echo "$result" | jq -r '.ResponseCode')"

          if [ "$status" != "Success" ] || [ "$response_code" -ne 0 ]; then
            echo "SSM deployment failed: status=$status response_code=$response_code" >&2
            exit 1
          fi
