name: CI

on:
  pull_request:
    branches:
      - main

# 読むだけ。GITHUB_TOKEN で書き込む処理は無い。
permissions:
  contents: read

jobs:
  # lockfileジョブ名を維持し、Linuxで実際に全workspaceをインストールする。
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify frozen install on Linux
        run: pnpm install --frozen-lockfile

      # Action をコミットのハッシュで固定しているか、permissions を書いているか（dev-standards 06 F2）。
      - name: Check workflows
        run: bash scripts/check-workflows.sh

      # 本番に載る依存に high 以上の既知の脆弱性があれば落とす（dev-standards 06 F3）。
      # PR が無い間に出た脆弱性は Dependabot alerts が知らせる。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  check:
    runs-on: ubuntu-latest
    # apps/api のテストは SQL を本物の MySQL に流す。テスト用 DB（juken_map_test）の
    # 作成とマイグレーションは vitest の globalSetup が行うので、ここでは起動するだけ。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_USER: juken
          MYSQL_PASSWORD: jukenpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint --max-warnings 0

      # API の契約（openapi/openapi.yaml）から作った TypeScript の型が、コミットされているものと同じか（JUK-76）。
      # 契約だけ直して生成し忘れた、生成物を手で直した、を落とす。
      - name: OpenAPI types (TypeScript)
        run: bash scripts/openapi-generate.sh --check ts

      # デプロイスクリプトのポート判断（無停止デプロイの要）。2026-09-23、upstream ファイルが
      # まだ無い初回の状態を試していなかったせいで本番のデプロイが落ちたので、ここで見る。
      - name: Deploy script port logic
        run: bash scripts/test-deploy-ports.sh

      # デプロイスクリプトが DB の資格情報をどのコンテナへ渡すか（JUK-81）。マイグレーション用の
      # 資格情報がアプリのコンテナに入らず、アプリに .env の接続先が渡らないことを見る。
      - name: Deploy script DB credentials
        run: bash scripts/test-deploy-db-users.sh

      # デプロイスクリプトが nginx の Go への振り分けをどう扱うか（JUK-72）。本番のサイト設定は
      # 手で置かれたものなので、差し込みを誤ると全部の応答が止まる。触る前に止まる条件も見る。
      - name: Deploy script Go routes
        run: bash scripts/test-deploy-go-routes.sh

      # デプロイスクリプトが毎日の通知のタイマーをどう入れるか（JUK-85）。共有トークンのファイルが
      # root だけに読める形で書かれること、トークンが無ければタイマーを止めることを見る。
      - name: Deploy script notification timers
        run: bash scripts/test-deploy-timers.sh

      # 本体のチェックアウトを main 以外へ動かすコマンドを止める Claude Code のフック（JUK-42）。
      - name: Main checkout guard hook
        run: bash scripts/test-guard-main-checkout.sh

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Type check apps
        run: |
          pnpm --filter @juken-map/api typecheck
          pnpm --filter @juken-map/web typecheck

      - name: Test
        run: pnpm test

      # apps/api と apps/web は独自の tsconfig を持つ別パッケージなので、
      # テストもそれぞれの vitest で実行する。
      - name: Test apps
        run: |
          pnpm --filter @juken-map/api test
          pnpm --filter @juken-map/web test

      # Go の API を本物の MySQL に流すテスト（apps/api-go の dbtest タグ、JUK-97）。他人の ID を断ること（A3）と、
      # 禁止項目を混ぜても書き換わらないこと（A4）を、本番で動いている Go のルートで確かめる。LINE 連携の SQL も流す。
      # DB は Node のテストと同じ juken_map_test（本番と同じマイグレーションと、DML だけの権限）。
      # MySQL がこのジョブにしか無いので、go のジョブではなくここで動かす。
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Test Go with DB
        run: |
          pnpm --filter @juken-map/api test-db:prepare
          cd apps/api-go && go test -tags dbtest -run 'TestA3|TestA4|TestLineStore' -count=1 ./...

      # 本番へ出るのは apps/web のバンドル。ここが壊れていないことを確認する。
      - name: Build SPA
        run: pnpm --filter @juken-map/web build

  # Go の API（apps/api-go、JUK-70）。pnpm workspace の外にあるので、ここで別に確かめる。
  # テストは DB を使わない。DB に流すテスト（dbtest タグ）は MySQL のある check のジョブで回し、
  # ここではコンパイルが通ることだけ見る。
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-go
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt -w . で整形してください"; exit 1; }

      # API の契約（openapi/openapi.yaml）から作った Go の型が、コミットされているものと同じか（JUK-76）。
      - name: OpenAPI types (Go)
        run: bash ../../scripts/openapi-generate.sh --check go

      - name: Vet
        run: |
          go vet ./...
          go vet -tags dbtest ./...

      # -race は、複数の goroutine が同じ値を同時に書き換えていないかを実行しながら見る。
      - name: Test
        run: go test -race ./...

      # pnpm audit の Go 版。実際に呼んでいる関数に既知の脆弱性があれば落とす（dev-standards 06 F3）。
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # 本番のイメージ（deploy.yml が main で作る）が作れることを、マージの前に確かめる。
      - name: Docker build
        run: docker build -t juken-map-go:ci .

  # E2E（Playwright）。使い捨ての MySQL 8.4 を立て、マイグレーション→seed→
  # SPA のビルド→Fastify 起動で本番相当の構成を立ち上げ、実ブラウザで主要導線を検証する。
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: juken_map
          MYSQL_USER: juken
          MYSQL_PASSWORD: jukenpassword
        ports:
          - 3306:3306
        # サービスが healthy になるまで GitHub が待ってからステップを実行する
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      # 使い捨て MySQL（ローカル Docker と同じ認証情報）へ接続する
      DATABASE_URL: mysql://juken:jukenpassword@127.0.0.1:3306/juken_map?allowPublicKeyRetrieval=true
      BETTER_AUTH_SECRET: ecPTNJXeffEkIMhtDiAKQI8X/dv0xZ5PWupA15w9rVU=
      BETTER_AUTH_URL: http://localhost:3000
      MICROCMS_SERVICE_DOMAIN: dummy
      MICROCMS_API_KEY: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # E2E は本番と同じく nginx（Docker）が Node と Go へ振り分ける（JUK-96、scripts/e2e-server.sh）。
      # Go は webServer の起動の中でビルドする。
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Run migrations
        run: pnpm run db:migrate

      - name: Seed master data and demo user
        run: pnpm exec tsx db/seed.ts

      # E2E 用ユーザーの投入は globalSetup（seed-e2e.ts）が、アプリ起動は
      # playwright.config の webServer（scripts/e2e-server.sh）が担当する。
      # SPA のビルドもそのスクリプトの中で行う。
      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
