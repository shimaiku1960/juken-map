name: CI

env:
  NPM_VERSION: 11.19.0

on:
  pull_request:
    branches:
      - main

jobs:
  # 各 package-lock.json に Linux 用ネイティブ依存が記録されているかを検査する。
  # mac で依存追加すると Linux 用オプショナル依存が lock から抜け、CI と本番イメージ
  # （どちらも Linux）の npm ci が落ちる npm の既知の挙動への対策。
  # npm を実行せず lockfile を直接読むため、実行OSに依存せず false positive が出ない。
  #
  # apps/web と apps/api も対象に含める。あちらの lockfile が壊れると、CI では気づかず
  # 本番イメージのビルド時に初めて落ちる。
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Linux native deps are in every package-lock.json
        run: >-
          node scripts/check-linux-native-deps.mjs
          package-lock.json apps/api/package-lock.json apps/web/package-lock.json

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use pinned npm version
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/api
          npm ci --prefix apps/web

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check apps
        run: |
          npm run typecheck --prefix apps/api
          npm run typecheck --prefix apps/web

      - name: Test
        run: npm test

      # apps/api と apps/web は独自の tsconfig を持つ別パッケージなので、
      # テストもそれぞれの vitest で実行する。
      - name: Test apps
        run: |
          npm run test --prefix apps/api
          npm run test --prefix apps/web

      # 本番へ出るのは apps/web のバンドル。ここが壊れていないことを確認する。
      - name: Build SPA
        run: npm run build --prefix apps/web

  # E2E（Playwright）。使い捨ての MySQL 8.4 を立て、マイグレーション→seed→
  # SPA のビルド→Fastify 起動で本番相当の構成を立ち上げ、実ブラウザで主要導線を検証する。
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: juken_map
          MYSQL_USER: juken
          MYSQL_PASSWORD: jukenpassword
        ports:
          - 3306:3306
        # サービスが healthy になるまで GitHub が待ってからステップを実行する
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      # 使い捨て MySQL（ローカル Docker と同じ認証情報）へ接続する
      DATABASE_URL: mysql://juken:jukenpassword@127.0.0.1:3306/juken_map?allowPublicKeyRetrieval=true
      BETTER_AUTH_SECRET: ecPTNJXeffEkIMhtDiAKQI8X/dv0xZ5PWupA15w9rVU=
      BETTER_AUTH_URL: http://localhost:3000
      MICROCMS_SERVICE_DOMAIN: dummy
      MICROCMS_API_KEY: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use pinned npm version
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/api
          npm ci --prefix apps/web

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed master data and demo user
        run: npx tsx prisma/seed.ts

      # E2E 用ユーザーの投入は globalSetup（seed-e2e.ts）が、アプリ起動は
      # playwright.config の webServer（scripts/e2e-server.sh）が担当する。
      # SPA のビルドもそのスクリプトの中で行う。
      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
