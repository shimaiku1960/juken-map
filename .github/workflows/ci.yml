name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  # lockfileジョブ名を維持し、Linuxで実際に全workspaceをインストールする。
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify frozen install on Linux
        run: pnpm install --frozen-lockfile

  check:
    runs-on: ubuntu-latest
    # apps/api のテストは SQL を本物の MySQL に流す。テスト用 DB（juken_map_test）の
    # 作成とマイグレーションは vitest の globalSetup が行うので、ここでは起動するだけ。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_USER: juken
          MYSQL_PASSWORD: jukenpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm exec eslint --max-warnings 0

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Type check apps
        run: |
          pnpm --filter @juken-map/api typecheck
          pnpm --filter @juken-map/web typecheck

      - name: Test
        run: pnpm test

      # apps/api と apps/web は独自の tsconfig を持つ別パッケージなので、
      # テストもそれぞれの vitest で実行する。
      - name: Test apps
        run: |
          pnpm --filter @juken-map/api test
          pnpm --filter @juken-map/web test

      # 本番へ出るのは apps/web のバンドル。ここが壊れていないことを確認する。
      - name: Build SPA
        run: pnpm --filter @juken-map/web build

  # E2E（Playwright）。使い捨ての MySQL 8.4 を立て、マイグレーション→seed→
  # SPA のビルド→Fastify 起動で本番相当の構成を立ち上げ、実ブラウザで主要導線を検証する。
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: juken_map
          MYSQL_USER: juken
          MYSQL_PASSWORD: jukenpassword
        ports:
          - 3306:3306
        # サービスが healthy になるまで GitHub が待ってからステップを実行する
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      # 使い捨て MySQL（ローカル Docker と同じ認証情報）へ接続する
      DATABASE_URL: mysql://juken:jukenpassword@127.0.0.1:3306/juken_map?allowPublicKeyRetrieval=true
      BETTER_AUTH_SECRET: ecPTNJXeffEkIMhtDiAKQI8X/dv0xZ5PWupA15w9rVU=
      BETTER_AUTH_URL: http://localhost:3000
      MICROCMS_SERVICE_DOMAIN: dummy
      MICROCMS_API_KEY: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed master data and demo user
        run: pnpm exec tsx prisma/seed.ts

      # E2E 用ユーザーの投入は globalSetup（seed-e2e.ts）が、アプリ起動は
      # playwright.config の webServer（scripts/e2e-server.sh）が担当する。
      # SPA のビルドもそのスクリプトの中で行う。
      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
