name: Daily study notifications

# 定期の送信は、本番 EC2 の systemd timer（infra/systemd/）が朝7時・夜21時に行う（JUK-85）。
# ここの schedule は毎回2〜4時間遅れ、夜の分が翌日の未明に「翌日の夜」として届いていたのでやめた。
# このワークフローは、手で1回送り直すとき（送り損ねた・確かめたい）だけに使う。
# 同じ日・同じ時間帯を2回呼んでも、配信記録で2回目は送らない。
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Notification slot
        required: true
        type: choice
        options:
          - morning
          - evening

# API を呼ぶだけで、リポジトリも GITHUB_TOKEN も使わない。
permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Select notification slot
        id: slot
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
        run: echo "value=$MANUAL_SLOT" >> "$GITHUB_OUTPUT"

      - name: Send notifications
        env:
          DAILY_NOTIFICATION_SECRET: ${{ secrets.DAILY_NOTIFICATION_SECRET }}
          SLOT: ${{ steps.slot.outputs.value }}
        run: |
          curl --fail-with-body --retry 2 \
            --request POST \
            --header "Authorization: Bearer $DAILY_NOTIFICATION_SECRET" \
            --header "Content-Type: application/json" \
            --data "{\"slot\":\"$SLOT\"}" \
            https://juken-map.com/api/cron/daily-study-notifications
