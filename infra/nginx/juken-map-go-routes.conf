# Go（apps/api-go）が返すパス。ここに書いたパスだけが Go へ行き、それ以外は今までどおり Node へ行く（JUK-70）。
#
# このファイルは .github/scripts/deploy-ec2.sh がデプロイのたびに本番の
# /etc/nginx/juken-map/go-routes.conf へ置く。本番のサイト設定（443 の server の中）はそれを include する。
#
# Node に戻す：このファイルの location を消して main に入れる（デプロイで反映）。
# 急ぐときは本番のファイルを空にして reload する（infra/nginx/README.md「Go の振り分け」）。
# Node 側のルートは消していないので、振り分けを外すだけで戻る。

location = /api/dashboard {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Node と同じく、利用者が送ってきた値は信用せず、接続元で上書きする。
    proxy_set_header X-Forwarded-For $remote_addr;
    # Go は圧縮しないので、ここで gzip にする（Node は自分で br・gzip にしている）。
    # ダッシュボードの応答は 100KB 前後あり、JSON はよく縮む（手元の実測 129KB → 5.5KB）。
    # 強さは Node（zlib の既定）と同じ 6。nginx の既定の 1 だと 7KB 弱で、Node より 2 割ほど大きい。
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# 読み取りだけを Go へ移したパス（JUK-73）。同じパスの書き込み（POST /api/study-logs など）は
# まだ Node にあるので、GET・HEAD 以外は下の @node へ回す。書き込みの無いパス（/daily）も同じにする。
# Node では PATCH /api/study-logs/daily が /:id に当たって 400 になるので、Go の 404 とずれないように。
#
# if の中で安全に使えるのは return と rewrite だけ（nginx の「If is Evil」）なので、
# 418 を返して error_page で名前付きの location へ渡す。method と本文はそのまま Node に届く。
location = /api/study-logs {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

location = /api/study-logs/daily {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

location = /api/study-plans {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# 上の location から回ってきた書き込みを Node へ送る。中身はサイト設定の location / と同じにする。
location @node {
    proxy_pass http://juken_map_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache_bypass $http_upgrade;
}

# Go の死活監視（Grafana Cloud Synthetic Monitoring）の入口。Go の /api/health（DB まで見る）を返す。
# /api/health は Node のままにしておき、Node と Go を別々に監視する。
location = /api/health/go {
    proxy_pass http://juken_map_go/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
