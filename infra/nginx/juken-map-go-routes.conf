# シミュレーション（GitHub Actions が毎時呼ぶ）。トークンの確認は Go が行う。
# Node の sim は消した（JUK-84）ので、/api/sim/ で始まるものは全部 Go へ送る。Go に無いメソッドやパスは 404。
location ^~ /api/sim/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 管理画面の API（JUK-78）。利用者の管理（概要・一覧・停止・停止解除・削除）とマスター編集（大学・学部・タグ・
# 参考書）を、書き込みも含めて全部 Go が受ける。管理者＋2段階認証の確認は Go が行う。
# ^~ は、この前方一致に当たったら正規表現の location を調べない指定（/api/admin/ で始まるものは必ずここ）。
location ^~ /api/admin/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# LINE 連携（JUK-79）。連携の確認・解除、トークからの連携、LINE Login の往復、Webhook を、書き込みも含めて Go が受ける。
# ^~ は、この前方一致に当たったら正規表現の location を調べない指定（/api/line/ で始まるものは必ずここ）。
# Webhook の署名は本文のバイト列で確かめるので、nginx は本文に手を加えない（proxy はそのまま渡す）。
location ^~ /api/line/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# microCMS の Webhook（JUK-112）。記事を変えたら、記事を作り直すデプロイ（deploy.yml）を動かす。
# 署名は本文のバイト列で確かめるので、LINE と同じく本文に手を加えない。本文の上限は client_max_body_size の既定（1m）で、
# Go の上限（microcmsWebhookBodyLimit）と同じ。
location = /api/webhooks/microcms {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# ログイン（JUK-115）。Better Auth（Node）から移し、登録・ログイン・ログアウト・メールの確認・再設定・2段階認証・
# 外部ログイン（Google・GitHub の戻り先 /api/auth/callback/{provider} も）を全部 Go が受ける。
# 回数制限は接続元の IP でも数えるので、X-Forwarded-For は利用者が送ってきた値を捨てて接続元で上書きする。
location ^~ /api/auth/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Go の死活監視（Grafana Cloud Synthetic Monitoring）の入口。Go の /api/health（DB まで見る）を返す。
# JUK-111 で /api/health も Go が返すようになったので、どちらも Go を見ている。
location = /api/health/go {
    proxy_pass http://juken_map_go/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 上のどれにも当たらないものは、全部 Go へ送る（JUK-111）。画面（SPA・SSG の HTML・静的ファイル）、sitemap.xml、
# /api/blog（microCMS の中継）、/api/health、/line/settings、存在しないパス（Go が 404 を返す）。
#
# 正規表現の location は、サイト設定の location /（^~ の付かない前方一致）より優先される。そのため本番の
# サイト設定（手で置いたもの）に手を入れずに、残りを Go へ向けられる。= と ^~ の location は正規表現より先に決まり、
# 正規表現どうしは書いた順に試すので、この受け皿は必ずファイルの最後に置く。
#
# 静的ファイルと画面の HTML は Go が自分で gzip にするので、ここでは圧縮しない。
location ~ ^/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
