# 大学の一覧。Go が圧縮済み（gzip）を返すので、ここでは圧縮しない（Content-Encoding が付いた応答は
# nginx の gzip も触らない）。ETag を弱い形に書き換えられないよう、gzip の設定も置かない。
location = /api/universities {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 大学詳細（/api/universities/{id}）。ID の形は Go が確かめ、不正なら 400 を返す（Node と同じ）。
# 正規表現の location は、サイト設定の location /（前方一致）より優先される。
location ~ ^/api/universities/[^/]+$ {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# 毎日の学習通知（JUK-74）。GitHub Actions が朝と夜に1回ずつ POST する。トークンの確認は Go が行う。
# 全員へ送り終えるまで時間がかかる。Go は50秒で打ち切って 500 を返し、curl が再試行する（送り済みは飛ばす）。
# それより先に nginx が切らないよう、待つ時間（既定の60秒）をここに書いておく。
location = /api/cron/daily-study-notifications {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}

# 小さい API（JUK-80）。本文の形（Content-Type）と大きさは Go が確かめ、Node と同じ 415・413 を返す。
# 登録の計測（POST だけ。GET などは Go も Node も 404）。
location = /api/analytics/registration {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# CSP の違反の報告（ブラウザが送る。ログインは要らない）。
location = /api/csp-report {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# シミュレーション（GitHub Actions が毎時呼ぶ）。トークンの確認は Go が行う。
# Go にあるメソッドだけを送る。Node は /api/sim/* のどれでもトークンが無ければ 401 を返すので、
# ほかのメソッドやパスは今までどおり Node に任せる（Go に送ると 404 になり、応答が変わる）。
location = /api/sim/state {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location = /api/sim/users {
    error_page 418 = @node;
    if ($request_method != POST) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location ~ ^/api/sim/users/[^/]+$ {
    error_page 418 = @node;
    if ($request_method != PATCH) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 管理画面の API（JUK-78）。利用者の管理（概要・一覧・停止・停止解除・削除）とマスター編集（大学・学部・タグ・
# 参考書）を、書き込みも含めて全部 Go が受ける。管理者＋2段階認証の確認は Go が行う。
# ^~ は、この前方一致に当たったら正規表現の location を調べない指定（/api/admin/ で始まるものは必ずここ）。
location ^~ /api/admin/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# LINE 連携（JUK-79）。連携の確認・解除、トークからの連携、LINE Login の往復、Webhook を、書き込みも含めて Go が受ける。
# ^~ は、この前方一致に当たったら正規表現の location を調べない指定（/api/line/ で始まるものは必ずここ）。
# Webhook の署名は本文のバイト列で確かめるので、nginx は本文に手を加えない（proxy はそのまま渡す）。
location ^~ /api/line/ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 上の location から回ってきた書き込みを Node へ送る。中身はサイト設定の location / と同じにする。
location @node {
    proxy_pass http://juken_map_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache_bypass $http_upgrade;
}

# Go の死活監視（Grafana Cloud Synthetic Monitoring）の入口。Go の /api/health（DB まで見る）を返す。
# /api/health は Node のままにしておき、Node と Go を別々に監視する。
location = /api/health/go {
    proxy_pass http://juken_map_go/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
