# 読み取りだけを Go へ移したパス（JUK-73）。同じパスの書き込み（POST /api/goals・/api/textbooks など）は
# まだ Node にあるので、GET・HEAD 以外は下の @node へ回す。書き込みの無いパス（/api/goals/first-choice）も同じにする。
# Node では PATCH /api/goals/first-choice が /:id に当たって 400 になるので、Go の 404 とずれないように。
#
# if の中で安全に使えるのは return と rewrite だけ（nginx の「If is Evil」）なので、
# 418 を返して error_page で名前付きの location へ渡す。method と本文はそのまま Node に届く。
location = /api/goals {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

location = /api/goals/first-choice {
    error_page 418 = @node;
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    proxy_pass http://juken_map_go;
