# 大学の一覧。Go が圧縮済み（gzip）を返すので、ここでは圧縮しない（Content-Encoding が付いた応答は
# nginx の gzip も触らない）。ETag を弱い形に書き換えられないよう、gzip の設定も置かない。
# 大学の一覧と詳細は読み取りだけ。ほかのメソッドは Go が 404 を返す。
location = /api/universities {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 大学詳細（/api/universities/{id}）。ID の形は Go が確かめ、不正なら 400 を返す（Node と同じ）。
# 正規表現の location は、サイト設定の location /（前方一致）より優先される。
location ~ ^/api/universities/[^/]+$ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# 毎日の学習通知（JUK-74）。GitHub Actions が朝と夜に1回ずつ POST する。トークンの確認は Go が行う。
# 全員へ送り終えるまで時間がかかる。Go は50秒で打ち切って 500 を返し、curl が再試行する（送り済みは飛ばす）。
# それより先に nginx が切らないよう、待つ時間（既定の60秒）をここに書いておく。
location = /api/cron/daily-study-notifications {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}

# 小さい API（JUK-80）。本文の形（Content-Type）と大きさは Go が確かめ、Node と同じ 415・413 を返す。
# 登録の計測（POST だけ。GET などは Go も Node も 404）。
location = /api/analytics/registration {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# CSP の違反の報告（ブラウザが送る。ログインは要らない）。
location = /api/csp-report {
