# Go（apps/api-go）が返すパス。ここに書いたパスだけが Go へ行き、それ以外は今までどおり Node へ行く（JUK-70）。
#
# このファイルは .github/scripts/deploy-ec2.sh がデプロイのたびに本番の
# /etc/nginx/juken-map/go-routes.conf へ置く。本番のサイト設定（443 の server の中）はそれを include する。
#
# Node に戻す：このファイルの location を消して main に入れる（デプロイで反映）。
# 急ぐときは本番のファイルを空にして reload する（infra/nginx/README.md「Go の振り分け」）。
# Node 側のルートは消していないので、振り分けを外すだけで戻る。

location = /api/dashboard {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Node と同じく、利用者が送ってきた値は信用せず、接続元で上書きする。
    proxy_set_header X-Forwarded-For $remote_addr;
    # Go は圧縮しないので、ここで gzip にする（Node は自分で br・gzip にしている）。
    # ダッシュボードの応答は 100KB 前後あり、JSON はよく縮む（手元の実測 129KB → 5.5KB）。
    # 強さは Node（zlib の既定）と同じ 6。nginx の既定の 1 だと 7KB 弱で、Node より 2 割ほど大きい。
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# 学習記録（実績）は、読み取り（JUK-73）も書き込み（JUK-75）も Go へ移したので、メソッドで分けずにすべて Go へ送る。
# /{id} は PATCH・DELETE。/daily の PATCH・DELETE は Node と同じく {id} に当たって 400 になる。
location = /api/study-logs {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

location = /api/study-logs/daily {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

# 正規表現の location は、サイト設定の location /（前方一致）より優先される。上の = /api/study-logs/daily（完全一致）はさらに優先。
location ~ ^/api/study-logs/[^/]+$ {
    proxy_pass http://juken_map_go;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    gzip on;
    gzip_comp_level 6;
    gzip_types application/json;
}

