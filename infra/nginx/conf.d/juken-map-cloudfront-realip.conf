# CloudFront の後ろで、利用者の IP を $remote_addr にする（JUK-185、2026-10-14〜）。
# /etc/nginx/conf.d/ に置く（http の中で読まれる）。
#
# CloudFront は、利用者から届いた X-Forwarded-For の末尾に、CloudFront へつないできた IP を足して
# オリジンへ渡す。real_ip_recursive off なので、nginx はその末尾（＝CloudFront が足した値）だけを使い、
# 利用者が自分で書いた前の値は使わない。各 location の `proxy_set_header X-Forwarded-For $remote_addr`
# は変えなくてよく、Go（internal/feature/auth/throttle.go）には利用者の IP が届く。
#
# ⚠️ 0.0.0.0/0 を信じてよいのは、セキュリティグループ（terraform/sg.tf の launch_wizard_2）が 443 を
# CloudFront だけに絞っているからである。そこを広げるなら、この設定も外すか絞る。
# SSM からサーバーの中で叩く curl（127.0.0.1）は X-Forwarded-For を付けないので、そのまま 127.0.0.1 になる。
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
