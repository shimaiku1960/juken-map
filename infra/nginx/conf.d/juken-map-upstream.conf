# アプリ（Docker コンテナ）の待ち受け先。nginx はこのファイルだけを見て転送先を決める。
#
# ⚠️ このファイルは本番では .github/scripts/deploy-ec2.sh が書き換える。手で編集しない。
# リポジトリのこれは「どういう形のファイルか」を示す控えで、ポート番号は入れ替わる。
#
# 無停止デプロイの仕組み：
#   新しいコンテナを空いている方のポート（3000 / 3001）で起こす
#   → /api/health が通るのを確かめる
#   → このファイルを書き換えて nginx を reload
#   → 古いコンテナを止める
# 切り替わるまで古いコンテナが応え続けるので、転送先が無人になる時間が生まれない。
upstream juken_map_app {
    server 127.0.0.1:3000;
}
