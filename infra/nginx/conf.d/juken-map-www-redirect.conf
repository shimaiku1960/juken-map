# www.juken-map.com を juken-map.com（apex）へ寄せる（JUK-23）。
#
# ⚠️ 本番の /etc/nginx/conf.d/ に手で置いたもの。デプロイ（deploy-ec2.sh）はこのファイルを触らない。
# 変えたら本番へ置き直して `nginx -t` → `systemctl reload nginx` する（手順は README の「www を apex へ寄せる」）。
#
# 入口を1つにするのは、ログインの Cookie をホストごとに分けずに済ませるため。
# Cookie に `__Host-` を付けると Domain を指定できず、www と apex でログインを共有できない（JUK-115）。
#
# サイト設定（sites-available/default）の server_name からは www を外してある。
# 外さないと同じ名前の server が2つになり、nginx は警告を出して先に読んだ方（conf.d が先）を使う。

# HTTP の www は、https://www を経由せずに1回で apex の HTTPS へ送る。
# return を server の直下ではなく location / に置くのは、証明書の更新（certbot の nginx プラグイン）が
# 足す /.well-known/acme-challenge/ の location を先に通すため。server の直下の return は location より先に効き、
# www の確認が転送されて更新が失敗する。
server {
    listen 80;
    listen [::]:80;
    server_name www.juken-map.com;

    location / {
        return 301 https://juken-map.com$request_uri;
    }
}

# HTTPS の www。証明書は apex と同じもの（www も入っている）を使う。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.juken-map.com;

    ssl_certificate     /etc/letsencrypt/live/juken-map.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juken-map.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://juken-map.com$request_uri;
}
