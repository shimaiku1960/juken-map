# Let's Encrypt の更新の確認（http-01）を、443 の server でも答える（JUK-185）。
#
# ⚠️ 本番の /etc/nginx/snippets/ に手で置き、443 の server（sites-available/default と
# conf.d/juken-map-www-redirect.conf）から include する。デプロイ（deploy-ec2.sh）は触らない。
#
# CloudFront を前に置くと、Let's Encrypt の確認は http://juken-map.com → CloudFront（https へ 301）
# → https://juken-map.com → CloudFront → オリジンの 443 と届く。80 には来ない。そのため certbot の
# 確認方法を nginx プラグイン（80 の server に一時的に location を足す）から webroot に替え、
# ここで確認用のファイルを返す。DNS を切り替える前（直接 EC2 に来る間）も、80 → 443 の 301 を経て
# 同じ location に届くので、切り替えの前後どちらでも更新が通る。
#
# ^~ にするのは、正規表現の location や location / の proxy_pass より先にここを選ばせるため。
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}
