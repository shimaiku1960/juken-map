packages:
  - apps/*
  # seed・テスト用 DB の準備・DB の接続。開発でしか使わない（JUK-130）。
  - db

# 各アプリの依存宣言は保ち、解決結果はルートの1ファイルで管理する。
sharedWorkspaceLockfile: true
# Dockerへコピーする依存のリンクをリポジトリ内で完結させる。
enableGlobalVirtualStore: false
# コマンド実行時に暗黙のinstallを行わず、依存変更後は明示的にinstallする。
verifyDepsBeforeRun: error

allowBuilds:
  esbuild: true
  sharp: true

# 使用するpeer依存も各package.jsonで明示する。
autoInstallPeers: false

# mysql2 を脆弱性の修正版より新しい版に固定する（JUK-38）。以前は better-auth の任意の peer として
# ルートと web でも解決されていた（better-auth は JUK-115 で外した）。
overrides:
  mysql2: ^3.24.4
