# プロジェクト名を固定する。未指定だとディレクトリ名から決まるため、git worktree
# （../juken-map-worktrees/<名前>）から db:start すると別プロジェクトになり、
# container_name の衝突や、空の別ボリュームでの起動が起きる。固定しておけば、
# どの worktree からも同じ DB コンテナとボリュームを使う。
name: juken-map

services:
  db:
    image: mysql:8.4
    container_name: juken-map-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: juken_map
      MYSQL_USER: juken
      MYSQL_PASSWORD: jukenpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: juken-map-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://juken:jukenpassword@db:3306/juken_map?allowPublicKeyRetrieval=true"
    depends_on:
      db:
        condition: service_healthy

  # ここから下は可観測性の学習用（pnpm run obs:start で起動）。profiles を付けているので、
  # db:start や docker compose up では起動しない。
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: juken-map-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.2
    container_name: juken-map-grafana
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      # 手元専用。admin / admin でログインする（初回のパスワード変更は Skip でよい）。
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # アラートのメールは Mailpit が受け取る（外へは送られない）。
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@example.com
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - mailpit

  # ログの保存先。イメージに入っている1台構成の設定（/etc/loki/local-config.yaml）をそのまま使う。
  loki:
    image: grafana/loki:3.7.7
    container_name: juken-map-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"

  # API が logs/ に書いた JSON を読み、Loki へ送る。
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: juken-map-alloy
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/juken-map:ro
    depends_on:
      - loki

  # トレースの保存先。API（instrumentation.ts）が OTLP で 4318 番へ送る。
  tempo:
    image: grafana/tempo:3.0.3
    container_name: juken-map-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: juken-map-mailpit
    profiles: ["observability"]
    ports:
      - "8025:8025"

volumes:
  mysql_data: